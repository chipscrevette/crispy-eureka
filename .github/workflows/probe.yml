name: Probe BDCOM
on:
  push:
    branches: [claude/probe-bdcom]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set +e
          {
          echo "== apur hub search"
          for q in commerce bdcom vacant "locaux vacants"; do
            echo "-- $q"
            curl -s "https://opendata.apur.org/api/search/v1/collections/dataset/items?q=$(jq -rn --arg q "$q" '$q|@uri')&limit=15" | jq -r '.features[]? | [.id, .properties.title, .properties.modified, (.properties.url // "")] | @tsv'
          done
          echo "== data.gouv bdcom"
          curl -s "https://www.data.gouv.fr/api/1/datasets/?q=bdcom&page_size=8" | jq -r '.data[]? | [.id, .title, (.organization.name // "")] | @tsv'
          curl -s "https://www.data.gouv.fr/api/1/datasets/?q=commerces%20apur&page_size=8" | jq -r '.data[]? | [.id, .title, (.organization.name // "")] | @tsv'
          echo "== plub_protcom sample"
          curl -s "https://opendata.paris.fr/api/explore/v2.1/catalog/datasets/plub_protcom/records?limit=3" | jq -c '.results[] | del(.geo_shape)'
          curl -s "https://opendata.paris.fr/api/explore/v2.1/catalog/datasets/plub_protcom/records?group_by=lib&limit=20" | jq -c '.results'
          echo "== zti sample"
          curl -s "https://opendata.paris.fr/api/explore/v2.1/catalog/datasets/zones-touristiques-internationales/records?limit=12" | jq -r '.results[] | del(.geo_shape) | tostring'
          echo "== datasets fields"
          curl -s "https://opendata.paris.fr/api/explore/v2.1/catalog/datasets/plub_protcom" | jq -c '[.fields[] | .name]'
          } > probe.txt 2>&1
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe.txt && git commit -m "Probe output [skip ci]" && git push
