name: Build data

# Rebuilds every Paris layer from the original sources and commits the result to
# the branch. It runs in Actions because the sources (Overture S3, data.gouv.fr,
# insee.fr) are reachable from here on any machine.

on:
  workflow_dispatch:
    inputs:
      overture_release:
        description: Overture Maps release
        default: 2026-10-21.0
  push:
    branches-ignore: [main]
    paths:
      - pipeline/src/**
      - pipeline/data/**
      - .github/workflows/data.yml

permissions:
  contents: write

concurrency:
  group: data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: pipeline/.cache
          key: sources-${{ hashFiles('pipeline/src/adresse_pipeline/dvf.py', 'pipeline/src/adresse_pipeline/insee.py') }}
      - run: pip install -e pipeline
      - name: Build layers
        run: python -m adresse_pipeline.build --overture-release "${{ inputs.overture_release || '2026-10-21.0' }}" | tee build.log
      - name: Commit changed layers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data pipeline/output
          if git diff --cached --quiet; then
            echo "Layers unchanged."
          else
            git commit -m "Rebuild Paris data layers" -m "$(cat build.log)"
            git push
          fi
