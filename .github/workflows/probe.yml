name: Probe tourism
on:
  push:
    branches: [claude/probe-tourism]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set +e
          {
          curl -sL "https://data.classement.atout-france.fr/static/exportHebergementsClasses/hebergements_classes.csv" -o h.csv
          echo "== paris hotels by stars"
          awk -F';' '$8 ~ /^75/ && $2 ~ /HÔTEL DE TOURISME/ {print $3" | cat="$4}' h.csv | sort | uniq -c
          echo "== paris 5 stars sample"
          awk -F';' '$8 ~ /^75/ && $3 ~ /5/ {print $4" | "$6" | "$7" | "$8" | "$13}' h.csv | head -15
          echo "== category values all"
          awk -F';' 'NR>1 {print $4}' h.csv | sort | uniq -c | sort -rn | head
          echo "== BAN csv geocode"
          printf 'id,adresse,postcode\n1,12 boulevard de Denain,75010\n2,6 Avenue Victor Hugo,75116\n3,7/9 Rue Pierre Chausson,75010\n' > t.csv
          curl -s -X POST -F data=@t.csv -F columns=adresse -F postcode=postcode "https://data.geopf.fr/geocodage/search/csv" | head -5
          echo "== old BAN"
          curl -s -X POST -F data=@t.csv -F columns=adresse -F postcode=postcode "https://api-adresse.data.gouv.fr/search/csv/" | head -5
          } > probe.txt 2>&1
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe.txt && git commit -m "Probe output [skip ci]" && git push
