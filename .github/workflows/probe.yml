name: Probe BDCOM
on:
  push:
    branches: [claude/probe-bdcom]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set +e
          {
          U=https://carto2.apur.org/apur/rest/services/BDCOM/bdcom2023/MapServer/0
          echo "== layer"
          curl -s "$U?f=json" | jq -c '{name, geometryType, maxRecordCount, fields: [.fields[] | [.name, .alias, .type]], drawingInfo: (.drawingInfo.renderer.field1 // null)}'
          echo "== count"
          curl -s "$U/query?where=1%3D1&returnCountOnly=true&f=json"
          echo "== sample"
          curl -s "$U/query?where=1%3D1&outFields=*&resultRecordCount=4&returnGeometry=true&outSR=4326&f=json" | jq -c '.features[]'
          echo "== item licence"
          curl -s "https://www.arcgis.com/sharing/rest/content/items/0984a17f57b148db95491085f2cc1533?f=json" | jq -c '{title, licenseInfo, accessInformation, description: (.description|tostring|.[0:1500])}'
          curl -s "https://opendata.apur.org/api/search/v1/collections/dataset/items/0984a17f57b148db95491085f2cc1533" | jq -c '.properties | {license, licenseInfo, source, description: (.description|tostring|.[0:1500])}'
          } > probe.txt 2>&1
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe.txt && git commit -m "Probe output [skip ci]" && git push
