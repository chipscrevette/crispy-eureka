<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Adresse : où une marque de luxe doit-elle ouvrir sa prochaine boutique à Paris, et pourquoi ?" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500&family=Figtree:wght@500&display=swap"
    />
    <script>
      // the theme is set before the first paint: the visitor's choice, else their system's
      var theme
      try {
        theme = localStorage.getItem('adresse-theme')
      } catch (e) {}
      var lang
      try {
        lang = localStorage.getItem('adresse-lang')
      } catch (e) {}
      // French by default: the site is about Paris; English on request
      document.documentElement.lang = lang === 'en' ? 'en' : 'fr'
      document.documentElement.dataset.theme =
        theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    </script>
    <title>Adresse · Choisir l’emplacement d’une boutique de luxe à Paris</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Adresse: where should a luxury brand open in Paris?" />
    <meta
      property="og:description"
      content="Every Paris block scored for jewellery, fashion and beauty brands from open data, with the reasons behind each score."
    />
    <meta property="og:url" content="https://chipscrevette.github.io/crispy-eureka/" />
    <meta property="og:image" content="https://chipscrevette.github.io/crispy-eureka/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/dashboard-main.tsx"></script>
  </body>
</html>
