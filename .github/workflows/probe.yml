name: Probe BDCOM
on:
  push:
    branches: [claude/probe-bdcom]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set +e
          {
          B=https://carto2.apur.org/apur/rest/services/BDCOM/bdcom2023/MapServer
          ST='&outStatistics=%5B%7B%22statisticType%22%3A%22count%22%2C%22onStatisticField%22%3A%22OBJECTID%22%2C%22outStatisticFieldName%22%3A%22n%22%7D%5D&f=json'
          for L in 1 3 4; do
            echo "== layer $L"
            curl -s "$B/$L?f=json" | jq -c '{name, geometryType, maxRecordCount, fields: [.fields[] | .name]}'
            curl -s "$B/$L/query?where=1%3D1&returnCountOnly=true&f=json"; echo
          done
          for f in niv2 niv8 niv18 type surf; do echo "== L1 $f"; curl -s "$B/1/query?where=1%3D1&groupByFieldsForStatistics=$f$ST" | jq -c '[.features[]?.attributes] | sort_by(-.n)'; done
          echo "== L1 vacant sample"
          curl -s "$B/1/query?where=niv18%3D213&outFields=*&resultRecordCount=3&outSR=4326&f=json" | jq -c '.features[]?'
          echo "== L1 vacant by arro"
          curl -s "$B/1/query?where=niv18%3D213&groupByFieldsForStatistics=arro$ST" | jq -c '[.features[]?.attributes] | sort_by(.arro)'
          echo "== L3 sample"
          curl -s "$B/3/query?where=1%3D1&outFields=*&resultRecordCount=2&returnGeometry=false&f=json" | jq -c '.features[]?'
          } > probe.txt 2>&1
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe.txt && git commit -m "Probe output [skip ci]" && git push
