name: Probe BDCOM
on:
  push:
    branches: [claude/probe-bdcom]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set +e
          {
          echo "== data.gouv commerces"
          curl -s "https://www.data.gouv.fr/api/1/datasets/?q=commerces+paris+bdcom&page_size=8" | jq -r '.data[] | [.id, .title, (.organization.name // ""), .last_update] | @tsv'
          echo "== data.gouv vacants"
          curl -s "https://www.data.gouv.fr/api/1/datasets/?q=locaux+vacants+paris&page_size=8" | jq -r '.data[] | [.id, .title, (.organization.name // ""), .last_update] | @tsv'
          echo "== opendata.paris commerce"
          curl -s "https://opendata.paris.fr/api/explore/v2.1/catalog/datasets?where=search(%22commerce%22)&limit=30" | jq -r '.results[] | [.dataset_id, .metas.default.title, .metas.default.modified, (.metas.default.records_count|tostring)] | @tsv'
          echo "== apur"
          curl -sL "https://opendata.apur.org/api/feed/dcat-ap/2.1.1.json" -o apur.json; head -c 300 apur.json; echo
          jq -r '.dataset[]? | select((.title|ascii_downcase)|test("commerce|bdcom|vacan")) | [.identifier, .title, .modified] | @tsv' apur.json | head -30
          } > probe.txt 2>&1
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe.txt && git commit -m "Probe output [skip ci]" && git push
