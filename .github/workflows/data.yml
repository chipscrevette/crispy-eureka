name: Build data

# Rebuilds every Paris layer from the original sources and commits the result to
# the branch. It runs in Actions because the sources (Overture S3, data.gouv.fr,
# insee.fr) are reachable from here on any machine. The opportunity scores are
# retrained on every rebuild so they always match the layers.

on:
  workflow_dispatch:
    inputs:
      overture_release:
        description: Overture Maps release
        default: 2026-10-21.0
  push:
    branches-ignore: [main]
    paths:
      - pipeline/src/**
      - pipeline/data/**
      - .github/workflows/data.yml

permissions:
  contents: write

concurrency:
  group: data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: pipeline/.cache
          key: sources-${{ hashFiles('pipeline/src/adresse_pipeline/dvf.py', 'pipeline/src/adresse_pipeline/insee.py', 'pipeline/src/adresse_pipeline/sirene.py') }}
      - run: pip install -e pipeline
      - name: Build layers
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          python -m adresse_pipeline.build --overture-release "${{ inputs.overture_release || '2026-10-21.0' }}" 2>&1 | tee build.log || {
            echo "::error title=Build failed::$(tail -n 8 build.log | tr '\n' ' ')"
            exit 1
          }
      - name: Walking catchments
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          python -m adresse_pipeline.walk --overture-release "${{ inputs.overture_release || '2026-10-21.0' }}" 2>&1 | tee -a build.log || {
            echo "::error title=Walking catchments failed::$(tail -n 8 build.log | tr '\n' ' ')"
            exit 1
          }
      - name: Demand per block
        shell: bash
        run: |
          set -o pipefail
          python -m adresse_pipeline.demand 2>&1 | tee -a build.log || {
            echo "::error title=Demand failed::$(tail -n 8 build.log | tr '\n' ' ')"
            exit 1
          }
      - name: Score cells
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          python -m adresse_pipeline.model 2>&1 | tee -a build.log || {
            echo "::error title=Model failed::$(tail -n 8 build.log | tr '\n' ' ')"
            exit 1
          }
      - name: Satellite benchmark
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          GDAL_HTTP_MAX_RETRY: "4"
          GDAL_HTTP_RETRY_DELAY: "5"
        run: |
          set -o pipefail
          { python -m adresse_pipeline.alphaearth && python -m adresse_pipeline.benchmark; } 2>&1 | tee -a build.log || {
            echo "::error title=Benchmark failed::$(tail -n 8 build.log | tr '\n' ' ')"
            exit 1
          }
      - name: Record Ask Adresse answers
        shell: bash
        run: |
          set -o pipefail
          python -m adresse_pipeline.ask 2>&1 | tee -a build.log || {
            echo "::error title=Ask Adresse failed::$(tail -n 8 build.log | tr '\n' ' ')"
            exit 1
          }
      - name: Commit changed layers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data pipeline/output
          if git diff --cached --quiet; then
            echo "Layers unchanged."
          else
            git commit -m "Rebuild Paris data layers" -m "$(cat build.log)"
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          fi
